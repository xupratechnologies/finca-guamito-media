# Cola de publicaciones de @fincaelguamito.
#
# Una fecha esta aqui o no esta: eso ES la cadencia. No hay una regla aparte
# que calcule "cada 2 dias", porque podria discrepar de esta lista y publicar
# un dia que no toca o callarse uno que si.
#
# Arrancamos cada 2 dias, que es el ritmo real de la cuenta. Se pasa a diario
# cuando el pipeline lleve dos semanas sin fallos.
#
# CAMPOS
#   fecha      AAAA-MM-DD. El dia que sale.
#   foto       ruta relativa a la raiz del proyecto.
#   foco       de donde recorta: centro | arriba | abajo | izquierda | derecha
#              Las fotos son horizontales y el post vertical, asi que se
#              descarta mas de la mitad del ancho. Esto decide cual mitad.
#   titulo     va SOBRE la imagen. El salto de linea lo eliges tu: en los posts
#              reales el corte esta pensado (TOMATE UN / RESPIRO).
#   caption    el texto del post. Formula de la cuenta:
#              "Hay [lugares/experiencias] que... 🌿✨" + salto + "En Finca el
#              Guamito, ..."
#   hashtags   sin la almohadilla, se anade sola.
#
# Como NO hay revision humana antes de publicar, lo que se encola tiene que
# estar bien encolado: el control de calidad esta aqui, no al final.


